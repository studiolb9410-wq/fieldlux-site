<body style="font-family: 'Geist', 'Geist Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: transparent; margin: 0;">
    <div id="root"></div>
    <!-- Headless-verification escape hatch (?flxheadless=1): hidden windows
         never fire requestAnimationFrame, so the R3F loop schedules once
         against a callback that never runs and the canvas stays frozen for
         automated drivers (Claude preview, future E2E). The flag swaps rAF
         for a 16 ms timer BEFORE the app boots. No effect without the flag. -->
    <script>
        if (new URLSearchParams(location.search).has('flxheadless')) {
            window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
            window.cancelAnimationFrame = (h) => clearTimeout(h);
        }
    </script>
